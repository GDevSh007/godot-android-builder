name: 🤖 Android Arm64 Template + PCK Encryption (Godot 4.8-dev2)
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: Android Arm64 Template Build
    timeout-minutes: 90
    
    defaults:
      run:
        working-directory: godot-source

    steps:
      # 1. Checkout Your Configuration Repo
      - name: Checkout Configs
        uses: actions/checkout@v4
        with:
          path: config-repo

      # 2. Checkout Godot Source at the Exact 4.8-dev2 Commit Hash
      - name: Checkout Godot Source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 7220d456dcf116ae5499505a237b449c0b00cfce  # FIX: Targets exact 4.8-dev2 source tree
          path: godot-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # Download and extract the frame-pacing helper dependencies
      - name: Download and Extract Swappy
        run: |
          TAG="from-source-2025-01-31"
          ASSET_NAME="godot-swappy.7z"
          curl -L -o godot-swappy.7z https://github.com
          mkdir -p thirdparty/swappy-frame-pacing
          7z x godot-swappy.7z -othirdparty/swappy-frame-pacing -y
          cd thirdparty/swappy-frame-pacing
          if [ -d android.* ]; then mv android.*/* .; fi
          cd ../..
          rm -f godot-swappy.7z

      # 3. Setup Encryption Key
      - name: Resolve Encryption Key
        id: crypto-setup
        run: |
          if [ -z "${{ secrets.GODOT_ENCRYPTION_KEY }}" ]; then
            GENERATED_KEY=$(openssl rand -hex 32)
            echo "::warning:: No GODOT_ENCRYPTION_KEY secret found! Auto-generated key for this run: $GENERATED_KEY"
            echo "encryption_key=$GENERATED_KEY" >> $GITHUB_OUTPUT
          else
            echo "encryption_key=${{ secrets.GODOT_ENCRYPTION_KEY }}" >> $GITHUB_OUTPUT
          fi

      # 4. Inject SCons settings via custom.py using explicit Python boolean rules
      - name: Configure Engine Demands
        run: |
          # Keep rendering_device True so the engine links smoothly without compiler errors
          echo 'rendering_device = True' >> custom.py
          echo 'vulkan = False' >> custom.py
          echo 'opengl = True' >> custom.py
          echo 'deprecated = False' >> custom.py
          echo 'minizip = False' >> custom.py

      # 5. Compilation Steps (Debug + Release Templates embedded with encryption)
      - name: Compile Release Template
        env:
          GODOT_VERSION_STATUS: dev2
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ steps.crypto-setup.outputs.encryption_key }}
        run: |
          scons platform=android \
                -j$(nproc) \
                target=template_release \
                arch=arm64 \
                build_profile="$GITHUB_WORKSPACE/config-repo/LudoMaxBuildProfile.gdbuild" \
                optimize=size \
                lto=full \
                debug_symbols=no \
                module_text_server_fb_enabled=yes \
                tests=no \
                swappy=yes

      - name: Compile Debug Template
        env:
          GODOT_VERSION_STATUS: dev2
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ steps.crypto-setup.outputs.encryption_key }}
        run: |
          scons platform=android \
                -j$(nproc) \
                target=template_debug \
                arch=arm64 \
                build_profile="$GITHUB_WORKSPACE/config-repo/LudoMaxBuildProfile.gdbuild" \
                optimize=size \
                lto=full \
                debug_symbols=no \
                module_text_server_fb_enabled=yes \
                tests=no \
                swappy=yes

      # 6. Process compiled libraries into usable Android APKs/AARs
      - name: Generate Godot Templates via Gradle
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates

      # 7. Upload compiled artifacts using Godot's internal structure path mapping
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-templates-4.8-dev2-encrypted-arm64
          path: |
            godot-source/platform/android/java/lib/bin/*.apk
            godot-source/platform/android/java/lib/bin/*.aar
